<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Maintenance - MovAni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 30, 55, 0.6);
            --primary: #f5c518;
            --primary-glow: rgba(245, 197, 24, 0.3);
            --text-main: #f5f6f8;
            --text-sub: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(245, 197, 24, 0.05) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(13, 110, 253, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .maintenance-container {
            max-width: 600px;
            width: 90%;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s ease-out;
        }

        .icon-container {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }

        .icon-pulse {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-glow);
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
            z-index: 1;
        }

        .icon-container i {
            font-size: 4rem;
            color: var(--primary);
            position: relative;
            z-index: 2;
            text-shadow: 0 0 20px var(--primary-glow);
            animation: rotateGear 10s infinite linear;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 197, 24, 0.1);
            color: var(--primary);
            border: 1px solid rgba(245, 197, 24, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 2rem;
            margin-top: 1rem;
        }

        .contact-info h4 {
            color: var(--text-main);
            margin-bottom: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
        }

        .social-links a {
            color: var(--text-sub);
            font-size: 1.2rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--primary);
            background: rgba(245, 197, 24, 0.1);
            border-color: rgba(245, 197, 24, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(245, 197, 24, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 0;
            }
            100% {
                transform: scale(0.95);
                opacity: 0.5;
            }
        }

        @keyframes rotateGear {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-container">
            <div class="icon-pulse"></div>
            <i class="fas fa-cog"></i>
        </div>
        <br>
        <span class="badge">Scheduled Maintenance</span>
        <h1>We'll Be Right Back!</h1>
        <p>
            MovAni is currently performing essential server updates and database optimizations to improve your review-sharing experience. We should be back online shortly. Thank you for your patience!
        </p>
        <div class="contact-info">
            <h4>Follow our updates</h4>
            <div class="social-links">
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Discord"><i class="fab fa-discord"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="Reddit"><i class="fab fa-reddit"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
